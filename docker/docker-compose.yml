services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voiceagent}
      POSTGRES_USER: ${POSTGRES_USER:-voiceagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceagent}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:v1.12.1
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  qdrant_storage:
